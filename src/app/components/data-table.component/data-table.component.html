<div class="filters-bar">
  <app-table-filters
    [activeFilters]="activeFiltersData()"
    [type]=" 'data'"
  ></app-table-filters>

  <button
    mat-raised-button
    color="primary"
    class="add-btn"
    (click)="onAdd()"
    aria-label="Add"
  >
    <mat-icon>add</mat-icon>
    Add
  </button>
</div>

<div class="container">
  <div class="table-wrapper">
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8 full-table"
    >
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">
          {{ row.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">
          {{ row.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="examDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">
          {{ row.examDate | date : "dd/MM/yyyy" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="grade">
        <th mat-header-cell *matHeaderCellDef>Grade</th>
        <td mat-cell *matCellDef="let row">
          {{ row.grade }}
        </td>
      </ng-container>

      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef>Subject</th>
        <td mat-cell *matCellDef="let row">
          {{ row.subject }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button
            *ngIf="selected() === row"
            mat-icon-button
            color="warn"
            (click)="onDelete(row); $event.stopPropagation()"
            matTooltip="Delete"
            aria-label="Delete"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="selectRecord(row)"
        [class.selected-row]="selected() === row"
      ></tr>
    </table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[10, 20, 50]"
      showFirstLastButtons
      aria-label="Select page"
    >
    </mat-paginator>
  </div>

  <app-data-details
    [selected]="selected()"
    (save)="onSaveTrainee($event)"
    (cancel)="onCancelEdit()"
  ></app-data-details>
</div>
